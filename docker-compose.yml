services:
  karsa-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: karsa-bot:latest
    container_name: karsa-bot
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 256m
    mem_reservation: 64m
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
